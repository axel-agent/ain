<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Werbebild kräftig</title>
<!-- Kräftige dunkle Vorlage (Stilregel ab 28.11.2026). Parameter: b=s|r, hero, kick, h1, h2, cut, v=1 (9:16) -->
<style>
:root{--bg:#111721;--or:#f0801e;--or2:#d9680f;--grey:#a9b2c1}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;background:var(--bg);color:#fff}
.hero{position:absolute;left:0;top:0;width:1080px;height:640px;background-size:165% auto;background-position:62% 72%;filter:saturate(1.25) contrast(1.08)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(17,23,33,0) 45%,rgba(17,23,33,.75) 75%,#111721 98%)}
.logo{position:absolute;left:36px;top:34px;background:#fff;border-radius:22px;padding:14px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.logo img{height:78px;display:block}
.pill{position:absolute;right:36px;top:46px;background:var(--or);color:#fff;font-weight:900;font-size:30px;letter-spacing:.06em;padding:16px 28px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hl{position:absolute;left:0;right:0;top:420px;padding:0 40px}
.kick{display:inline-block;background:rgba(17,23,33,.88);color:var(--or);font-weight:900;font-size:28px;letter-spacing:.12em;padding:10px 18px;border-radius:10px;text-transform:uppercase}
.h1,.h2{font-weight:900;line-height:.95;letter-spacing:-.02em;white-space:nowrap;text-shadow:0 6px 24px rgba(0,0,0,.6)}
.h1{font-size:90px;margin-top:14px}.h2{font-size:128px;color:var(--or)}
.mid{position:absolute;left:40px;right:40px;top:800px;height:360px;display:flex;gap:26px}
.card{position:relative;width:520px;height:360px;flex:none;background:#fff;border-radius:24px;overflow:hidden}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lb{position:absolute;transform:translate(-50%,-50%);background:var(--or);color:#fff;font-weight:900;font-size:27px;padding:5px 14px;border-radius:10px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.facts{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.f{display:flex;align-items:center;gap:16px}
.f i{width:50px;height:50px;border-radius:50%;background:var(--or);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:30px}
.f b{display:block;font-size:36px;font-weight:900;line-height:1.02;white-space:nowrap}.f span{display:block;font-size:22px;font-weight:600;color:var(--grey);margin-top:2px;white-space:nowrap}
.call{position:absolute;left:0;right:0;top:1186px;height:120px;background:linear-gradient(90deg,var(--or),var(--or2));display:flex;align-items:center;padding:0 40px}
.call .ph{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;margin-right:22px}
.call .ph svg{width:42px;height:42px;fill:var(--or)}
.call small{display:block;font-weight:900;font-size:22px;letter-spacing:.2em}
.call .n{font-weight:900;font-size:64px;line-height:1;white-space:nowrap}
.call .w{margin-left:auto;text-align:right;font-weight:800;font-size:22px;line-height:1.4;white-space:nowrap}
.addr{position:absolute;left:0;right:0;top:1312px;text-align:center;font-size:21px;font-weight:600;color:var(--grey)}
/* 9:16 (Startbild im Video) */
body.v{height:1920px}
body.v .hero{height:900px;background-size:auto 125%;background-position:60% 70%}body.v .hl{top:640px}body.v .h1{font-size:90px}body.v .h2{font-size:128px}
body.v .mid{top:1010px;height:560px;flex-direction:column;gap:22px}body.v .card{width:1000px;height:360px}body.v .logo img{height:96px}body.v .pill{font-size:34px}body.v .card img{object-position:center 55%}
body.v .facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px}body.v .f b{font-size:38px}
body.v .call{top:1630px;height:170px;justify-content:center}body.v .call .n{font-size:88px}body.v .call .w{display:none}body.v .call small{font-size:26px}
body.v .addr{top:1830px;font-size:26px;line-height:1.5}
</style></head><body>
<div class="hero" id="hero"></div>
<div class="logo"><img id="logo"></div><div class="pill">NEUBAU · BEZUG 2027</div>
<div class="hl"><div class="kick" id="kick"></div><div class="h1" id="h1"></div><div class="h2" id="h2"></div></div>
<div class="mid">
 <div class="card"><img id="cut" src="../out/cut_side_neutral_poster.jpg">

  <div class="f"><i>✓</i><div><b>ca. 150 m²</b><span>je Einheit · 7 Einheiten</span></div></div>
  <div class="f"><i>✓</i><div><b>Halle + Lager</b><span>im Erdgeschoß</span></div></div>
  <div class="f"><i>✓</i><div><b>Büro + WC</b><span>oben auf der Galerie</span></div></div>
  <div class="f"><i>✓</i><div><b>Sektionaltor</b><span>groß, für Transporter</span></div></div>
  <div class="f"><i>✓</i><div><b>Fußbodenheizung</b><span>überall warm</span></div></div>
 </div></div>
<div class="call"><div class="ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></div>
 <div><small id="ck"></small><div class="n" id="num"></div></div><div class="w" id="web"></div></div>
<div class="addr" id="addr"></div>
<script>
const q = new URLSearchParams(location.search), r = q.get('b') === 'r';
if (q.get('v')) document.body.classList.add('v');

document.getElementById('addr').innerHTML = 'Josef-Madersperger-Str. 2 · 9065 Ebenthal bei Klagenfurt' + (q.get('v') ? '<br>' + (r ? 'Russinov Immobilien · www.russinov.at' : 'Schmacher Solutions GmbH · www.gewerbepark-klagenfurt.at') : '');
